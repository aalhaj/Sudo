<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Sudoku</h1>
            <div class="header-controls">
                <select id="difficulty-select">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                    <option value="expert">Expert</option>
                </select>
                <button id="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="game-info">
            <div class="info-item">
                <span class="label">Mistakes</span>
                <span class="value" id="mistakes">0/3</span>
            </div>
            <div class="info-item">
                <span class="label">Time</span>
                <span class="value" id="timer">00:00</span>
            </div>
            <div class="info-item">
                <span class="label">Difficulty</span>
                <span class="value" id="difficulty-display">Medium</span>
            </div>
        </div>

        <div class="game-board-container">
            <div id="game-board" class="game-board">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <div class="controls-area">
            <div class="tools">
                <button class="tool-btn" id="btn-undo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                    </svg>
                    <span>Undo</span>
                </button>
                <button class="tool-btn" id="btn-erase">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"></path>
                        <path d="M11 11L17 17"></path>
                    </svg>
                    <span>Erase</span>
                </button>
                <button class="tool-btn" id="btn-note">
                    <div class="note-indicator">OFF</div>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                        <path d="M11 11l-4 4"></path>
                    </svg>
                    <span>Notes</span>
                </button>
                <button class="tool-btn" id="btn-hint">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"></path>
                        <path d="M9 21v1h6v-1"></path>
                    </svg>
                    <span>Hint</span>
                </button>
            </div>

            <div class="numpad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
            </div>
            
            <button id="btn-new-game" class="new-game-btn">New Game</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="game-over-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Game Over</h2>
            <p>You made too many mistakes!</p>
            <button id="btn-restart">Try Again</button>
        </div>
    </div>

    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Excellent!</h2>
            <p>You solved the puzzle!</p>
            <p class="win-time">Time: <span id="final-time">00:00</span></p>
            <p class="win-difficulty">Difficulty: <span id="final-difficulty">Medium</span></p>
            <button id="btn-new-game-win">New Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
